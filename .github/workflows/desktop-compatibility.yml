name: Desktop compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            vscode: stable
          - os: windows-latest
            vscode: '1.114.0'
          - os: windows-latest
            vscode: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      IJSS_E2E_INSPECTOR_ON_DEMAND: '1'
      IJSS_E2E_REQUIRE_CDP: '1'
      IJSS_E2E_VSCODE_VERSION: ${{ matrix.vscode }}
      IJSS_E2E_TIMING_REPORT: '1'
      IJSS_E2E_MIRROR_LOGS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run compile
      - run: npm run test:unit
      - run: npm run test:build-cache
      - run: cargo test --locked -p zoek-rs
      - run: npm run build:zoek-runtime
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest' && matrix.vscode == 'stable'
        with:
          name: native-win32-x64
          path: resources/bin/win32-x64/
      - name: Desktop acceptance
        run: npm test -- --run out/test/suite/desktopCompatibility.test.js
      - name: Extension functional regressions
        run: npm test -- --exclude out/test/suite/renderer.test.js --exclude out/test/suite/captainIndexGate.test.js
      - name: Renderer acceptance and hardware timing budgets
        id: renderer_diagnostics
        run: npm test -- --run out/test/suite/renderer.test.js
      - name: Summarize renderer diagnostics
        if: always()
        env:
          IJSS_RENDERER_DIAGNOSTICS_OUTCOME: ${{ steps.renderer_diagnostics.outcome }}
        run: |
          node -e "const fs = require('node:fs'); const outcome = process.env.IJSS_RENDERER_DIAGNOSTICS_OUTCOME || 'skipped'; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Full renderer acceptance\n\nResult: **' + outcome + '**.\n\nThe complete renderer suite, including save/recovery, repeated-click behavior and the existing hardware timing budgets, is required. Failures fail this job.\n');"
      - name: Collect desktop logs
        if: always()
        run: node scripts/collectDesktopTestLogs.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.vscode }}
          path: |
            artifacts/desktop-compatibility/
            artifacts/desktop-test-logs/
            resources/bin/*/

  windows-user-setup:
    needs: desktop
    if: always() && !cancelled()
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - uses: actions/download-artifact@v7
        with:
          name: native-win32-x64
          path: resources/bin/win32-x64/
      - name: Windows 11 x64 UserSetup under a standard account
        shell: pwsh
        run: ./scripts/test-windows-user-setup.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-11-standard-user-setup
          path: |
            artifacts/windows-user-setup/*.json
            artifacts/windows-user-setup/*.log
            artifacts/desktop-compatibility/
