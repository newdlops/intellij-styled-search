name: Desktop compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      IJSS_E2E_INSPECTOR_ON_DEMAND: '1'
      IJSS_E2E_REQUIRE_CDP: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run compile
      - run: npm run test:unit
      - run: npm run test:build-cache
      - run: cargo test --locked -p zoek-rs
      - run: npm run build:zoek-runtime
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            artifacts/desktop-compatibility/
            resources/bin/*/
