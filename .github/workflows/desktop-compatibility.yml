name: Desktop compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      enforce_timings:
        description: Enforce the existing hardware timing budgets
        type: boolean
        default: false
      preview_click_repeats:
        description: Repetitions of the 16-click preview latency probe
        type: choice
        options: ['1', '5', '10', '20']
        default: '1'

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            vscode: stable
          - os: windows-latest
            vscode: '1.114.0'
          - os: windows-latest
            vscode: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      IJSS_E2E_INSPECTOR_ON_DEMAND: '1'
      IJSS_E2E_REQUIRE_CDP: '1'
      IJSS_E2E_VSCODE_VERSION: ${{ matrix.vscode }}
      IJSS_E2E_TIMING_REPORT: '1'
      # Shared-runner wall-clock measurements stay visible without treating
      # host scheduling noise as a functional failure. Manual runs can retain
      # the same strict budgets; local renderer tests are strict by default.
      IJSS_E2E_TIMING_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce_timings && 'strict' || 'report' }}
      IJSS_E2E_MIRROR_LOGS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run compile
      - run: npm run test:unit
      - run: npm run test:build-cache
      - run: cargo test --locked -p zoek-rs
      - run: npm run build:zoek-runtime
      - name: Semantic usage locations and live count parity
        run: node scripts/checkUsageSemantics.js
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest' && matrix.vscode == 'stable'
        with:
          name: native-win32-x64
          path: resources/bin/win32-x64/
      - name: Desktop acceptance
        run: npm test -- --run out/test/suite/desktopCompatibility.test.js
      - name: Extension functional regressions
        run: npm test -- --exclude out/test/suite/renderer.test.js --exclude out/test/suite/captainIndexGate.test.js
      - name: Renderer acceptance and hardware timing report
        id: renderer_diagnostics
        env:
          # Preserve channel logs/artifacts without stdout IPC changing the
          # rendering latency measured by this step.
          IJSS_E2E_MIRROR_LOGS: '0'
          # Interactive budgets require foreground scheduling even when the
          # hosted desktop session is disconnected or occluded. The test logs
          # the actual window policy; it does not warm the first hint request.
          IJSS_E2E_FOREGROUND_TIMINGS: '1'
          IJSS_E2E_PREVIEW_CLICK_REPEATS: ${{ inputs.preview_click_repeats || '10' }}
          IJSS_E2E_TIMING_JSON: artifacts/desktop-compatibility/renderer-timings.json
        run: npm test -- --run out/test/suite/renderer.test.js
      - name: Summarize renderer diagnostics
        if: always()
        env:
          IJSS_RENDERER_DIAGNOSTICS_OUTCOME: ${{ steps.renderer_diagnostics.outcome }}
        run: node scripts/summarizeRendererTests.js
      - name: Collect desktop logs
        if: always()
        run: node scripts/collectDesktopTestLogs.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.vscode }}
          path: |
            artifacts/desktop-compatibility/
            artifacts/desktop-test-logs/
            resources/bin/*/

  windows-user-setup:
    needs: desktop
    if: always() && !cancelled()
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - uses: actions/download-artifact@v7
        with:
          name: native-win32-x64
          path: resources/bin/win32-x64/
      - name: Windows 11 x64 UserSetup under a standard account
        shell: pwsh
        run: ./scripts/test-windows-user-setup.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-11-standard-user-setup
          path: |
            artifacts/windows-user-setup/*.json
            artifacts/windows-user-setup/*.log
            artifacts/desktop-compatibility/
