[package]
name = "zoek-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "zoek_rs"
path = "src/lib.rs"

[[bin]]
name = "zoek-rs"
path = "src/bin/zoek-rs.rs"

[[bin]]
name = "ijss-rebuild"
path = "src/bin/ijss-rebuild.rs"

[dependencies]
regex = "1.11.1"
ahash = "0.8"
crossbeam-channel = "0.5"
libc = "0.2"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
memmap2 = "0.9"
hashbrown = "0.14"
